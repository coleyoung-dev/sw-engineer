<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">SagarVision BVH projection flow chart</title>
  <desc id="desc">Flow chart for mesh loading, BVH build, probe input, nearest surface projection, and visual update.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2b3445"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0b1026" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f6f8fb; }
      .lane { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .box { fill: #ffffff; stroke: #2b3445; stroke-width: 2; rx: 12; }
      .box-soft { fill: #eef7f4; stroke: #0f766e; }
      .box-hot { fill: #fff5e6; stroke: #b45309; }
      .box-blue { fill: #edf4ff; stroke: #2563eb; }
      .decision { fill: #fff; stroke: #7c3aed; stroke-width: 2; }
      .arrow { stroke: #2b3445; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 8; }
      .title { font: 800 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .lane-title { font: 800 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .tiny { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="980"/>
  <text class="title" x="64" y="70">BVH 기반 실시간 최단 거리 투영 로직</text>
  <text class="small" x="64" y="104">메쉬 로드 시 공간 가속 구조를 한 번 구축하고, 매 프레임 프로브 좌표를 뼈 표면의 최근접점으로 변환합니다.</text>

  <rect class="lane" x="48" y="140" width="360" height="760"/>
  <rect class="lane" x="460" y="140" width="360" height="760"/>
  <rect class="lane" x="872" y="140" width="360" height="760"/>

  <text class="lane-title" x="82" y="184">1. 초기화 / BVH 생성</text>
  <text class="lane-title" x="494" y="184">2. 실시간 쿼리</text>
  <text class="lane-title" x="906" y="184">3. 시각화 / 폴백</text>

  <rect class="box box-blue" x="86" y="226" width="284" height="78"/>
  <text class="label" x="114" y="258">Bone Mesh 로드</text>
  <text class="small" x="114" y="282">Femur / Tibia MeshFilter</text>

  <rect class="box box-blue" x="86" y="350" width="284" height="94"/>
  <text class="label" x="114" y="382">정점 / 삼각형 캐싱</text>
  <text class="small" x="114" y="406">vertices, triangles 배열 저장</text>
  <text class="small" x="114" y="428">bone index별 캐시 유지</text>

  <rect class="box box-soft" x="86" y="490" width="284" height="118"/>
  <text class="label" x="114" y="522">BuildBVHRecursive</text>
  <text class="small" x="114" y="548">AABB 계산</text>
  <text class="small" x="114" y="572">가장 긴 축 기준 정렬</text>
  <text class="small" x="114" y="596">삼각형 4개 이하 리프 생성</text>

  <rect class="box box-soft" x="86" y="660" width="284" height="86"/>
  <text class="label" x="114" y="692">BVH 캐시 완료</text>
  <text class="small" x="114" y="716">이후 투영 요청에서 재사용</text>

  <rect class="box box-hot" x="498" y="226" width="284" height="94"/>
  <text class="label" x="526" y="258">Probe 위치 수신</text>
  <text class="small" x="526" y="282">UDP / AR marker / 테스트 입력</text>
  <text class="small" x="526" y="304">local 또는 world 좌표</text>

  <rect class="box box-hot" x="498" y="366" width="284" height="92"/>
  <text class="label" x="526" y="398">좌표계 정규화</text>
  <text class="small" x="526" y="422">world 입력은 mesh local로 변환</text>
  <text class="small" x="526" y="444">현재 bone index 선택</text>

  <path class="decision" d="M640 510 L782 590 L640 670 L498 590 Z"/>
  <text class="label" x="576" y="584">BVH 존재?</text>
  <text class="small" x="588" y="610">캐시 사용 가능</text>

  <rect class="box box-soft" x="498" y="722" width="284" height="94"/>
  <text class="label" x="526" y="754">QueryBVH</text>
  <text class="small" x="526" y="778">AABB 거리로 가지치기</text>
  <text class="small" x="526" y="800">가까운 자식 노드부터 방문</text>

  <rect class="box box-soft" x="910" y="226" width="284" height="118"/>
  <text class="label" x="938" y="258">Leaf 삼각형 검사</text>
  <text class="small" x="938" y="284">ClosestPointOnTriangle</text>
  <text class="small" x="938" y="308">내부면 그대로 사용</text>
  <text class="small" x="938" y="332">외부면 edge/vertex로 clamp</text>

  <rect class="box box-soft" x="910" y="404" width="284" height="94"/>
  <text class="label" x="938" y="436">bestSqDist 갱신</text>
  <text class="small" x="938" y="462">현재 최단 거리보다 먼</text>
  <text class="small" x="938" y="484">AABB branch는 skip</text>

  <rect class="box box-blue" x="910" y="558" width="284" height="94"/>
  <text class="label" x="938" y="590">표면 좌표 반환</text>
  <text class="small" x="938" y="614">local/world 옵션에 맞춰 변환</text>
  <text class="small" x="938" y="636">Probe 위치 갱신</text>

  <rect class="box box-hot" x="910" y="712" width="284" height="104"/>
  <text class="label" x="938" y="744">시각 효과 업데이트</text>
  <text class="small" x="938" y="768">outline / light spot</text>
  <text class="small" x="938" y="792">highlight center 배열 전달</text>

  <rect class="box" x="498" y="850" width="284" height="54"/>
  <text class="label" x="526" y="884">Brute-force fallback</text>

  <path class="arrow" d="M228 304 L228 350"/>
  <path class="arrow" d="M228 444 L228 490"/>
  <path class="arrow" d="M228 608 L228 660"/>
  <path class="arrow" d="M370 703 C432 703 432 273 498 273"/>
  <path class="arrow" d="M640 320 L640 366"/>
  <path class="arrow" d="M640 458 L640 510"/>
  <path class="arrow" d="M640 670 L640 722"/>
  <path class="arrow" d="M782 590 C850 590 850 285 910 285"/>
  <path class="arrow" d="M1052 344 L1052 404"/>
  <path class="arrow" d="M1052 498 L1052 558"/>
  <path class="arrow" d="M1052 652 L1052 712"/>
  <path class="arrow dash" d="M498 590 C440 590 440 876 498 876"/>
  <path class="arrow dash" d="M782 876 C866 876 866 605 910 605"/>

  <text class="tiny" x="790" y="570">YES</text>
  <text class="tiny" x="452" y="614">NO</text>
  <text class="tiny" x="64" y="936">핵심 포인트: 초기 빌드 비용은 모델 로드 시점에 지불하고, 런타임에는 AABB 거리 기반 가지치기로 삼각형 검사량을 줄입니다.</text>
</svg>
