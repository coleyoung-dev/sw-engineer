<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">SagarVision UniRx MVP architecture flow</title>
  <desc id="desc">Network data and user input flow through Model, Presenter, and View layers using UniRx reactive streams.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#102a43"/>
      <stop offset="1" stop-color="#17324d"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="presenter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="view" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10 Z" fill="#cbd5e1"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 700 34px Arial, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 500 18px Arial, sans-serif; }
      .label { fill: #ffffff; font: 700 24px Arial, sans-serif; }
      .small { fill: #e2e8f0; font: 500 16px Arial, sans-serif; }
      .tiny { fill: #cbd5e1; font: 500 14px Arial, sans-serif; }
      .pill { fill: rgba(15, 23, 42, 0.42); stroke: rgba(255, 255, 255, 0.18); stroke-width: 1; }
      .card { rx: 22; filter: url(#shadow); stroke: rgba(255, 255, 255, 0.18); stroke-width: 1; }
      .flow { fill: none; stroke: #cbd5e1; stroke-width: 4; marker-end: url(#arrow); }
      .return { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 10 9; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <circle cx="1080" cy="110" r="170" fill="#38bdf8" opacity="0.08"/>
  <circle cx="165" cy="680" r="210" fill="#22c55e" opacity="0.07"/>

  <text x="72" y="82" class="title">UniRx-Based MVP Architecture</text>
  <text x="72" y="118" class="subtitle">Network packets, user intent, and Unity UI are connected through reactive streams.</text>

  <rect x="70" y="180" width="210" height="132" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="96" y="224" class="label">TCP / UDP</text>
  <text x="96" y="256" class="small">Server packets</text>
  <text x="96" y="284" class="tiny">planning, landmark, gap, resection</text>

  <rect x="70" y="448" width="210" height="132" rx="20" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="96" y="492" class="label">User Input</text>
  <text x="96" y="524" class="small">Button observables</text>
  <text x="96" y="552" class="tiny">select, undo, reset, flip, tab</text>

  <rect x="380" y="160" width="238" height="454" class="card" fill="url(#model)"/>
  <text x="420" y="214" class="label">Model</text>
  <text x="420" y="246" class="small">Protocol-facing state</text>
  <rect x="410" y="288" width="178" height="48" rx="14" class="pill"/>
  <text x="432" y="318" class="tiny">ReactiveProperty</text>
  <rect x="410" y="354" width="178" height="48" rx="14" class="pill"/>
  <text x="430" y="384" class="tiny">ReactiveCollection</text>
  <rect x="410" y="420" width="178" height="48" rx="14" class="pill"/>
  <text x="439" y="450" class="tiny">packet parsing</text>
  <rect x="410" y="486" width="178" height="48" rx="14" class="pill"/>
  <text x="439" y="516" class="tiny">broadcast bits</text>
  <text x="420" y="570" class="tiny">PlanningModel, LandmarkModel,</text>
  <text x="420" y="594" class="tiny">GapModel, ResectionModel</text>

  <rect x="692" y="160" width="238" height="454" class="card" fill="url(#presenter)"/>
  <text x="732" y="214" class="label">Presenter</text>
  <text x="732" y="246" class="small">Binding and workflow rules</text>
  <rect x="722" y="288" width="178" height="48" rx="14" class="pill"/>
  <text x="742" y="318" class="tiny">Subscribe / map</text>
  <rect x="722" y="354" width="178" height="48" rx="14" class="pill"/>
  <text x="744" y="384" class="tiny">DistinctUntilChanged</text>
  <rect x="722" y="420" width="178" height="48" rx="14" class="pill"/>
  <text x="745" y="450" class="tiny">Network commands</text>
  <rect x="722" y="486" width="178" height="48" rx="14" class="pill"/>
  <text x="752" y="516" class="tiny">state configs</text>
  <text x="732" y="570" class="tiny">LandmarkBasePresenter,</text>
  <text x="732" y="594" class="tiny">GapBasePresenter, screen presenters</text>

  <rect x="1004" y="160" width="238" height="454" class="card" fill="url(#view)"/>
  <text x="1044" y="214" class="label">View</text>
  <text x="1044" y="246" class="small">Unity component binding</text>
  <rect x="1034" y="288" width="178" height="48" rx="14" class="pill"/>
  <text x="1052" y="318" class="tiny">IObservable input</text>
  <rect x="1034" y="354" width="178" height="48" rx="14" class="pill"/>
  <text x="1061" y="384" class="tiny">Text / Images</text>
  <rect x="1034" y="420" width="178" height="48" rx="14" class="pill"/>
  <text x="1062" y="450" class="tiny">GameObjects</text>
  <rect x="1034" y="486" width="178" height="48" rx="14" class="pill"/>
  <text x="1067" y="516" class="tiny">AR HUD UI</text>
  <text x="1044" y="570" class="tiny">LandmarkBaseView, PlanningView,</text>
  <text x="1044" y="594" class="tiny">GapView, ResectionView</text>

  <path d="M280 246 C316 246 334 246 370 246" class="flow"/>
  <path d="M618 386 C646 386 654 386 682 386" class="flow"/>
  <path d="M930 386 C958 386 966 386 994 386" class="flow"/>
  <path d="M1004 520 C956 664 740 682 618 542" class="return"/>
  <path d="M280 514 C448 682 652 668 692 522" class="return"/>

  <text x="305" y="226" class="tiny">parse buffer</text>
  <text x="626" y="365" class="tiny">reactive state</text>
  <text x="938" y="365" class="tiny">UI update</text>
  <text x="685" y="692" class="tiny">commands back to NetworkManager</text>
  <text x="340" y="648" class="tiny">user intent as observable</text>
</svg>
