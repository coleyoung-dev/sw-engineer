<svg width="1280" height="860" viewBox="0 0 1280 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SagarVision AR 실시간 트래킹 및 UDP 통신 시퀀스 다이어그램</title>
  <desc id="desc">C++ 서버에서 Unity UDP listener thread를 거쳐 main thread와 AR scene에 실시간 pose 데이터가 반영되는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0B1026"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1B75BC"/>
    </marker>
    <style>
      .bg { fill: #F7FAFC; }
      .title { fill: #0B1026; font: 800 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #4B5563; font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .lane { fill: #FFFFFF; stroke: #D7DEE8; stroke-width: 1.4; }
      .lane-title { fill: #0B1026; font: 800 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .lane-sub { fill: #586174; font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .lifeline { stroke: #C5CEDA; stroke-width: 1.5; stroke-dasharray: 7 8; }
      .step { fill: #FFFFFF; stroke: #0B1026; stroke-width: 1.5; }
      .step-blue { fill: #E9F6FB; stroke: #1B75BC; stroke-width: 1.5; }
      .step-green { fill: #ECF8F1; stroke: #168A55; stroke-width: 1.5; }
      .step-warn { fill: #FFF7E0; stroke: #B7791F; stroke-width: 1.5; }
      .step-text { fill: #111827; font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .step-detail { fill: #4B5563; font: 600 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { stroke: #0B1026; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-blue { stroke: #1B75BC; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .arrow-soft { stroke: #637083; stroke-width: 1.8; stroke-dasharray: 6 6; marker-end: url(#arrow); }
      .label { fill: #0B1026; font: 800 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #5B6472; font: 600 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .chip { fill: #0B1026; }
      .chip-text { fill: #FFFFFF; font: 800 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="860" rx="0"/>
  <text class="title" x="48" y="54">실시간 트래킹 및 UDP 통신 데이터 플로우</text>
  <text class="subtitle" x="48" y="82">TCP 초기화로 세션과 포트를 맞추고, UDP listener thread가 실시간 pose packet을 파싱해 Unity main thread로 전달합니다.</text>

  <g transform="translate(42 112)">
    <rect class="lane" x="0" y="0" width="190" height="86" rx="8"/>
    <text class="lane-title" x="95" y="34" text-anchor="middle">C++ Backend</text>
    <text class="lane-sub" x="95" y="58" text-anchor="middle">Tracker / Pose 계산</text>
  </g>
  <g transform="translate(272 112)">
    <rect class="lane" x="0" y="0" width="190" height="86" rx="8"/>
    <text class="lane-title" x="95" y="34" text-anchor="middle">NetworkManager</text>
    <text class="lane-sub" x="95" y="58" text-anchor="middle">TCP 초기화 / 모드 제어</text>
  </g>
  <g transform="translate(502 112)">
    <rect class="lane" x="0" y="0" width="190" height="86" rx="8"/>
    <text class="lane-title" x="95" y="34" text-anchor="middle">UdpManager</text>
    <text class="lane-sub" x="95" y="58" text-anchor="middle">Listener thread / Parser</text>
  </g>
  <g transform="translate(732 112)">
    <rect class="lane" x="0" y="0" width="190" height="86" rx="8"/>
    <text class="lane-title" x="95" y="34" text-anchor="middle">Unity Main Thread</text>
    <text class="lane-sub" x="95" y="58" text-anchor="middle">Dispatcher callback</text>
  </g>
  <g transform="translate(962 112)">
    <rect class="lane" x="0" y="0" width="190" height="86" rx="8"/>
    <text class="lane-title" x="95" y="34" text-anchor="middle">AR Controllers</text>
    <text class="lane-sub" x="95" y="58" text-anchor="middle">Probe / ARSystem / Gap</text>
  </g>

  <line class="lifeline" x1="137" y1="198" x2="137" y2="790"/>
  <line class="lifeline" x1="367" y1="198" x2="367" y2="790"/>
  <line class="lifeline" x1="597" y1="198" x2="597" y2="790"/>
  <line class="lifeline" x1="827" y1="198" x2="827" y2="790"/>
  <line class="lifeline" x1="1057" y1="198" x2="1057" y2="790"/>

  <rect class="chip" x="48" y="220" width="84" height="26" rx="13"/>
  <text class="chip-text" x="90" y="238" text-anchor="middle">초기화</text>

  <line class="arrow" x1="367" y1="258" x2="137" y2="258"/>
  <text class="label" x="252" y="248" text-anchor="middle">Broadcast server discovery</text>
  <text class="small" x="252" y="274" text-anchor="middle">ServerName / finding port 8888</text>

  <line class="arrow-blue" x1="137" y1="306" x2="367" y2="306"/>
  <text class="label" x="252" y="296" text-anchor="middle">TCP connect + init packet</text>
  <text class="small" x="252" y="322" text-anchor="middle">UDP version, AR mode, assigned client port</text>

  <line class="arrow-blue" x1="367" y1="354" x2="597" y2="354"/>
  <text class="label" x="482" y="344" text-anchor="middle">Create UdpManager</text>
  <text class="small" x="482" y="370" text-anchor="middle">Bind client port or fallback port</text>

  <line class="arrow-blue" x1="137" y1="402" x2="367" y2="402"/>
  <text class="label" x="252" y="392" text-anchor="middle">Server init data</text>
  <text class="small" x="252" y="418" text-anchor="middle">Device mode, landmark type, TCP/UDP protocol version</text>

  <line class="arrow-blue" x1="367" y1="450" x2="597" y2="450"/>
  <text class="label" x="482" y="440" text-anchor="middle">SetVersion + StartUDP</text>
  <text class="small" x="482" y="466" text-anchor="middle">Background listener thread starts</text>

  <rect class="chip" x="48" y="496" width="84" height="26" rx="13"/>
  <text class="chip-text" x="90" y="514" text-anchor="middle">실시간</text>

  <line class="arrow" x1="137" y1="534" x2="597" y2="534"/>
  <text class="label" x="367" y="524" text-anchor="middle">UDP pose packet stream</text>
  <text class="small" x="367" y="550" text-anchor="middle">20-byte header + mode-specific binary payload</text>

  <g transform="translate(506 574)">
    <rect class="step-warn" x="0" y="0" width="182" height="62" rx="8"/>
    <text class="step-text" x="91" y="23" text-anchor="middle">Header / CRC 검증</text>
    <text class="step-detail" x="91" y="44" text-anchor="middle">checksum 실패 시 packet 폐기</text>
  </g>

  <line class="arrow" x1="597" y1="636" x2="597" y2="674"/>

  <g transform="translate(498 674)">
    <rect class="step-blue" x="0" y="0" width="198" height="78" rx="8"/>
    <text class="step-text" x="99" y="22" text-anchor="middle">UDP_Mode 분기</text>
    <text class="step-detail" x="99" y="43" text-anchor="middle">Landmark / ARSystem / Gap</text>
    <text class="step-detail" x="99" y="61" text-anchor="middle">Installation / Resection</text>
  </g>

  <line class="arrow-blue" x1="696" y1="714" x2="827" y2="714"/>
  <text class="label" x="762" y="704" text-anchor="middle">EnqueueAsync</text>
  <text class="small" x="762" y="730" text-anchor="middle">Unity object update boundary</text>

  <line class="arrow-blue" x1="827" y1="764" x2="1057" y2="764"/>
  <text class="label" x="942" y="754" text-anchor="middle">Callback invoke</text>
  <text class="small" x="942" y="780" text-anchor="middle">SetData / SetUDPData / SetGapLine / SetPlane</text>

  <g transform="translate(962 805)">
    <rect class="step-green" x="0" y="0" width="190" height="38" rx="8"/>
    <text class="step-text" x="95" y="24" text-anchor="middle">AR Scene transform 갱신</text>
  </g>

  <g transform="translate(86 610)">
    <rect class="step" x="0" y="0" width="220" height="86" rx="8"/>
    <text class="step-text" x="110" y="24" text-anchor="middle">Workflow controller</text>
    <text class="step-detail" x="110" y="45" text-anchor="middle">현재 수술 단계에 맞춰</text>
    <text class="step-detail" x="110" y="63" text-anchor="middle">ChangeUDPMode / SetUDPProbeAct</text>
  </g>
  <line class="arrow-soft" x1="306" y1="654" x2="498" y2="704"/>

  <g transform="translate(1008 604)">
    <rect class="step" x="0" y="0" width="200" height="96" rx="8"/>
    <text class="step-text" x="100" y="24" text-anchor="middle">Pose 적용 예시</text>
    <text class="step-detail" x="100" y="45" text-anchor="middle">Probe: surface projection</text>
    <text class="step-detail" x="100" y="63" text-anchor="middle">Marker: Matrix4x4.TRS</text>
    <text class="step-detail" x="100" y="81" text-anchor="middle">Glass: tracking HUD state</text>
  </g>
  <line class="arrow-soft" x1="1057" y1="700" x2="1057" y2="805"/>
</svg>
